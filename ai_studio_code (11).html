<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral App - 8K Admin Control Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        .crisp-img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans select-none pb-20">

    <!-- Header Banner -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 p-4 shadow-xl backdrop-blur-md bg-slate-900/90">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-purple-600 rounded-2xl flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm text-white tracking-wide">8K Admin Control Panel</h1>
                    <p class="text-[10px] text-purple-400 font-bold">পোস্ট আপলোড ও ডিলিট সেন্টার</p>
                </div>
            </div>
            <span class="bg-purple-500/10 text-purple-400 text-[10px] font-extrabold px-3 py-1 rounded-full border border-purple-500/20 flex items-center gap-1">
                <i class="fa-solid fa-bolt"></i> 8K Ultra HD
            </span>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4 space-y-6">

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-800 gap-1">
            <button id="tab-btn-create" onclick="switchAdminTab('create')" class="flex-1 py-2.5 text-xs font-black rounded-xl bg-purple-600 text-white transition flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-plus-circle"></i> নতুন পোস্ট আপলোড
            </button>
            <button id="tab-btn-manage" onclick="switchAdminTab('manage')" class="flex-1 py-2.5 text-xs font-black rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-layer-group"></i> সকল পোস্ট (<span id="total-posts-count">0</span>)
            </button>
        </div>

        <!-- ================= TAB 1: CREATE & UPLOAD POST ================= -->
        <div id="view-create-post" class="space-y-5 bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl">
            <h2 class="text-sm font-black text-purple-400 flex items-center gap-2 pb-2 border-b border-slate-800">
                <i class="fa-solid fa-cloud-arrow-up"></i> নতুন ভিডিও পোস্ট যুক্ত করুন
            </h2>

            <div class="space-y-4">
                <!-- Title Input -->
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-300">পোস্টের টাইটেল / নাম *</label>
                    <input type="text" id="post-title" placeholder="যেমন: Viral Cute College Girl Video..." 
                           class="w-full bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none transition">
                </div>

                <!-- Category Input -->
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-300">ক্যাটাগরি</label>
                    <input type="text" id="post-category" placeholder="যেমন: Bangladeshi, College, College Girl..." 
                           class="w-full bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none transition">
                </div>

                <!-- 🌟 QUALITY SELECTOR BOX (স্ক্রিনশটের মতো যুক্ত করা হয়েছে) -->
                <div class="space-y-2 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                    <label class="text-[11px] font-extrabold text-purple-400 block">ভিডিও / ফটো কোয়ালিটি নির্বাচন করুন</label>
                    
                    <div class="space-y-1 text-xs">
                        <label class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-900 cursor-pointer">
                            <span class="text-slate-300">1280x720 — HD quality</span>
                            <input type="radio" name="post_quality" value="HD" class="accent-purple-500">
                        </label>
                        <label class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-900 cursor-pointer">
                            <span class="text-slate-300">1920x1080 — Full HD quality</span>
                            <input type="radio" name="post_quality" value="Full HD" class="accent-purple-500">
                        </label>
                        <label class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-900 cursor-pointer">
                            <span class="text-slate-300">3840x2160 — 4K quality</span>
                            <input type="radio" name="post_quality" value="4K" class="accent-purple-500">
                        </label>
                        <label class="flex items-center justify-between p-2.5 rounded-xl bg-purple-950/40 border border-purple-500/30 cursor-pointer">
                            <span class="text-purple-300 font-bold">7680x4320 — 8K quality</span>
                            <input type="radio" name="post_quality" value="8K" checked class="accent-purple-500">
                        </label>
                    </div>
                </div>

                <!-- Thumbnail 1 Uploader -->
                <div class="space-y-1.5 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                    <label class="text-[11px] font-bold text-slate-300 flex items-center justify-between">
                        <span>১ম ছবি (Thumbnail 1) *</span>
                        <span class="text-[10px] text-purple-400">8K Auto Host</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="thumb1-url" placeholder="ছবি আপলোড করলে লিংক এখানে অটো বসবে" 
                               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 outline-none">
                        <label class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-2 rounded-xl text-xs cursor-pointer shrink-0 transition flex items-center gap-1.5 shadow">
                            <i class="fa-solid fa-image"></i> গ্যালারি
                            <input type="file" accept="image/*" class="hidden" onchange="uploadImageToHost(this, 'thumb1-url', 'thumb1-preview')">
                        </label>
                    </div>
                    <img id="thumb1-preview" src="" class="hidden w-full h-32 object-cover rounded-xl border border-slate-800 crisp-img mt-2">
                </div>

                <!-- Thumbnail 2 Uploader (Optional) -->
                <div class="space-y-1.5 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                    <label class="text-[11px] font-bold text-slate-300 flex items-center justify-between">
                        <span>২য় ছবি (Thumbnail 2 - ঐচ্ছিক)</span>
                        <span class="text-[10px] text-slate-500">ডাবল ছবির জন্য</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="thumb2-url" placeholder="দ্বিতীয় ছবি থাকলে অপশনাল আপলোড করুন" 
                               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 outline-none">
                        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-2 rounded-xl text-xs cursor-pointer shrink-0 transition flex items-center gap-1.5 border border-slate-700">
                            <i class="fa-solid fa-image"></i> গ্যালারি
                            <input type="file" accept="image/*" class="hidden" onchange="uploadImageToHost(this, 'thumb2-url', 'thumb2-preview')">
                        </label>
                    </div>
                    <img id="thumb2-preview" src="" class="hidden w-full h-32 object-cover rounded-xl border border-slate-800 crisp-img mt-2">
                </div>

                <!-- Main Video Link -->
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-300">ভিডিও লিংক (Streamable / MP4 URL)</label>
                    <input type="text" id="video-url" placeholder="https://streamable.com/e/xxxxx অথবা .mp4 লিংক" 
                           class="w-full bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none transition">
                </div>

                <!-- Telegram Bot Video Link -->
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-300">টেলিগ্রাম বট ভিডিও লিংক (ঐচ্ছিক)</label>
                    <input type="text" id="bot-video-url" placeholder="https://t.me/ViralVideoInternationalBot?start=..." 
                           class="w-full bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none transition">
                </div>

                <!-- Upload Submit Button -->
                <button id="publish-btn" onclick="publishNewPost()" 
                        class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:brightness-110 active:scale-95 text-white font-black py-3.5 rounded-2xl text-xs tracking-wider transition shadow-xl shadow-purple-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> পোস্ট পাবলিশ করুন
                </button>
            </div>
        </div>

        <!-- ================= TAB 2: MANAGE & DELETE POSTS ================= -->
        <div id="view-manage-posts" class="hidden space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-sm font-black text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list"></i> প্রকাশিত সকল পোস্টসমূহ
                </h2>
                <span class="text-[10px] text-slate-500">স্বয়ংক্রিয় সিঙ্ক হয়</span>
            </div>

            <!-- Posts List Container -->
            <div id="posts-list-container" class="space-y-3">
                <p class="text-center text-slate-500 py-10 text-xs">পোস্ট লোড হচ্ছে...</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtKYGQ-fvuVifuDNJ_tlNmKJ2gjEqyYWU",
            authDomain: "viralzone-3e974.firebaseapp.com",
            databaseURL: "https://viralzone-3e974-default-rtdb.firebaseio.com",
            projectId: "viralzone-3e974",
            storageBucket: "viralzone-3e974.firebasestorage.app",
            messagingSenderId: "63267470809",
            appId: "1:63267470809:web:fa7f5d92063e69c42aadc8",
            measurementId: "G-7L6FPDW7X2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const IMGBB_API_KEY = "2d391d1e443f169f42777176a9117652";

        function switchAdminTab(tab) {
            const createTab = document.getElementById('view-create-post');
            const manageTab = document.getElementById('view-manage-posts');
            const btnCreate = document.getElementById('tab-btn-create');
            const btnManage = document.getElementById('tab-btn-manage');

            if (tab === 'create') {
                createTab.classList.remove('hidden');
                manageTab.classList.add('hidden');
                btnCreate.className = "flex-1 py-2.5 text-xs font-black rounded-xl bg-purple-600 text-white transition flex items-center justify-center gap-2 shadow-md";
                btnManage.className = "flex-1 py-2.5 text-xs font-black rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center gap-2";
            } else {
                createTab.classList.add('hidden');
                manageTab.classList.remove('hidden');
                btnManage.className = "flex-1 py-2.5 text-xs font-black rounded-xl bg-purple-600 text-white transition flex items-center justify-center gap-2 shadow-md";
                btnCreate.className = "flex-1 py-2.5 text-xs font-black rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center gap-2";
            }
        }

        async function uploadImageToHost(inputEl, targetInputId, previewImgId) {
            const file = inputEl.files[0];
            if (!file) return;

            const targetInput = document.getElementById(targetInputId);
            const previewImg = document.getElementById(previewImgId);

            targetInput.value = "আপলোড হচ্ছে (8K Resolution)...";
            
            const formData = new FormData();
            formData.append("image", file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    const imageUrl = data.data.url;
                    targetInput.value = imageUrl;
                    previewImg.src = imageUrl;
                    previewImg.classList.remove('hidden');
                } else {
                    alert("ছবি আপলোড হতে সমস্যা হয়েছে!");
                    targetInput.value = "";
                }
            } catch (err) {
                alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
                targetInput.value = "";
            }
        }

        function publishNewPost() {
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value.trim() || 'General';
            const thumb1 = document.getElementById('thumb1-url').value.trim();
            const thumb2 = document.getElementById('thumb2-url').value.trim();
            const videoUrl = document.getElementById('video-url').value.trim();
            const botVideoUrl = document.getElementById('bot-video-url').value.trim();
            const quality = document.querySelector('input[name="post_quality"]:checked')?.value || '8K';
            const publishBtn = document.getElementById('publish-btn');

            if (!title) {
                alert("দয়া করে পোস্টের টাইটেলটি দিন!");
                return;
            }
            if (!thumb1) {
                alert("কমপক্ষে ১ম ছবিটি আপলোড করুন!");
                return;
            }

            publishBtn.disabled = true;
            publishBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> পাবলিশ হচ্ছে...`;

            const newPostData = {
                title: title,
                category: category,
                thumbnail1: thumb1,
                thumbnail2: thumb2 || '',
                thumbMode: thumb2 ? 'double' : 'single',
                url: videoUrl || '',
                botVideoUrl: botVideoUrl || '',
                badge: `${quality} QUALITY 🌟`,
                quality: quality,
                views: 0,
                likes: 0,
                createdAt: Date.now()
            };

            database.ref('videos').push(newPostData).then(() => {
                alert(`✅ 8K কোয়ালিটি সহ পোস্টটি পাবলিশ করা হয়েছে!`);
                resetForm();
                switchAdminTab('manage');
            }).catch((err) => {
                alert("❌ পোস্ট পাবলিশে ত্রুটি: " + err.message);
            }).finally(() => {
                publishBtn.disabled = false;
                publishBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> পোস্ট পাবলিশ করুন`;
            });
        }

        function resetForm() {
            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('thumb1-url').value = '';
            document.getElementById('thumb2-url').value = '';
            document.getElementById('video-url').value = '';
            document.getElementById('bot-video-url').value = '';
            document.getElementById('thumb1-preview').classList.add('hidden');
            document.getElementById('thumb2-preview').classList.add('hidden');
        }

        database.ref('videos').on('value', (snapshot) => {
            const postsMap = snapshot.val() || {};
            const keys = Object.keys(postsMap).reverse();
            
            document.getElementById('total-posts-count').innerText = keys.length;
            const container = document.getElementById('posts-list-container');
            container.innerHTML = '';

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-10 text-xs">কোনো পোস্ট পাওয়া যায়নি।</p>`;
                return;
            }

            keys.forEach(key => {
                const item = postsMap[key];
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between gap-3 shadow-md hover:border-slate-700 transition";

                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img src="${item.thumbnail1 || 'https://via.placeholder.com/150'}" class="w-14 h-14 object-cover rounded-xl border border-slate-800 shrink-0 crisp-img">
                        <div class="truncate space-y-1">
                            <h4 class="font-extrabold text-white text-xs leading-snug truncate">${item.title}</h4>
                            <div class="flex items-center gap-2 text-[10px] text-slate-400 font-bold">
                                <span class="bg-purple-950 text-purple-300 px-2 py-0.5 rounded-md border border-purple-800/50">${item.badge || '8K QUALITY'}</span>
                                <span>👁️ ${item.views || 0} views</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="deletePost('${key}', '${escapeHtml(item.title)}')" 
                            class="bg-red-500/10 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/20 w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition active:scale-90" title="Delete Post">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        });

        function deletePost(key, title) {
            if (confirm(`আপনি কি নিশ্চিত যে পোস্টটি ডিলিট করতে চান?\n\n"${title}"`)) {
                database.ref('videos/' + key).remove().then(() => {
                    alert("🗑️ পোস্টটি স্থায়ীভাবে ডিলিট করা হয়েছে!");
                });
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
