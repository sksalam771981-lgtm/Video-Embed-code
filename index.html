<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanent Video & Embed Generator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container { max-width: 650px; margin: 0 auto; }
        
        .upload-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            text-align: center;
        }
        .upload-card h2 { margin-top: 0; color: #1a1a1a; font-size: 20px; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e5e7eb;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #0066ff;
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="file"] { display: none; }
        .file-label {
            display: block;
            background: #f8f9fa;
            border: 2px dashed #0066ff;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            color: #0066ff;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .file-info {
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
            display: none;
            background: #eef5ff;
            padding: 8px;
            border-radius: 6px;
        }
        .url-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .btn-action {
            background-color: #0066ff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-action:hover { background-color: #0052cc; }

        .progress-bar-container {
            width: 100%;
            background: #e5e7eb;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00c6ff);
            width: 0%;
            transition: width 0.1s ease;
        }
        #status { margin-top: 12px; font-weight: bold; color: #0066ff; font-size: 14px; }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .dashboard-header h3 { margin: 0; font-size: 18px; color: #222; }

        .video-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        video, iframe { width: 100%; height: 350px; display: block; background: #000; border: none; }
        .card-body { padding: 15px; }
        .video-title { font-weight: 600; font-size: 15px; margin: 0 0 10px 0; color: #111; word-break: break-word; }
        
        .link-row {
            display: flex;
            gap: 8px;
            background: #f3f4f6;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
            align-items: center;
        }
        .link-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #0066ff; text-decoration: none; font-weight: bold; }
        .btn-copy { background: #e5e7eb; border: none; color: #333; cursor: pointer; font-weight: bold; font-size: 12px; padding: 6px 10px; border-radius: 4px; }
        .btn-copy-main { background: #0066ff; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 12px; padding: 6px 12px; border-radius: 4px; }
        .btn-open { background: #28a745; color: white; text-decoration: none; font-weight: bold; font-size: 12px; padding: 6px 10px; border-radius: 4px; }

        .actions-row { display: flex; gap: 10px; border-top: 1px solid #f0f0f0; padding-top: 10px; }
        .action-btn {
            flex: 1;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #444;
            font-weight: 500;
        }
        .action-btn.delete { color: #dc3545; border-color: #f8d7da; background: #fff5f5; }

        .embed-box { display: none; background: #fafafa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-top: 10px; }
        textarea { width: 100%; height: 60px; font-size: 11px; font-family: monospace; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="upload-card">
        <h2>🔒 Permanent Video & Embed Generator</h2>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('fileTab')">📁 স্থায়ী ফাইল আপলোড (Never Expires)</button>
            <button class="tab-btn" onclick="switchTab('linkTab')">🔗 যেকোনো অফ-সাইট ভিডিও লিংক</button>
        </div>

        <!-- ১. স্থায়ী ভিডিও ফাইল আপলোড (Catbox Permanent Engine) -->
        <div class="tab-content active" id="fileTab">
            <label for="videoInput" class="file-label" id="fileLabel">📁 মোবাইল থেকে ভিডিও বেছে নিন (Up to 200 MB)</label>
            <input type="file" id="videoInput" accept="video/*" onchange="updateFileInfo()">
            <div class="file-info" id="fileInfo"></div>
            <button class="btn-action" onclick="uploadPermanentVideo()">আপলোড শুরু করুন</button>
        </div>

        <!-- ২. যেকোনো ভিডিও লিঙ্ক পেস্ট (Catbox, Streamtape, Telegram, YouTube, etc.) -->
        <div class="tab-content" id="linkTab">
            <input type="text" id="urlInput" class="url-input" placeholder="যেকোনো ভিডিও লিঙ্ক বসান (.mp4 / .html / Streamtape / Telegram)">
            <p style="font-size: 11px; color: #666; margin-top: 0; margin-bottom: 12px; text-align: left;">
                * Catbox, Telegram, Streamtape, Upfiles, Luluvid, Gofile, Pixeldrain, YouTube বা যেকোনো .mp4/.html লিঙ্ক দেওয়া যাবে।
            </p>
            <button class="btn-action" onclick="generateUniversalEmbed()">এমবেড ও অটো লিঙ্ক তৈরি করুন</button>
        </div>
        
        <div class="progress-bar-container" id="progressBar">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div id="status"></div>
    </div>

    <div class="dashboard-header">
        <h3 id="videoCountText">All videos (0)</h3>
    </div>

    <div id="videoList"></div>
</div>

<script>
    // আপনার প্রদেয় Catbox User Hash
    const userHash = "821d1a31a17407896add03c2d"; 

    document.addEventListener('DOMContentLoaded', loadVideos);

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(tabId === 'fileTab') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('fileTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('linkTab').classList.add('active');
        }
    }

    function updateFileInfo() {
        const input = document.getElementById('videoInput');
        const label = document.getElementById('fileLabel');
        const info = document.getElementById('fileInfo');

        if (input.files.length > 0) {
            const file = input.files[0];
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            label.innerText = `✅ নির্বাচিত: ${file.name}`;
            info.innerHTML = `📊 ভিডিও সাইজ: <strong>${sizeMB} MB</strong> (সর্বোচ্চ ২০০ MB - কখনো ডিলিট হবে না)`;
            info.style.display = 'block';
        }
    }

    // ১. স্থায়ী ভিডিও আপলোড ইঞ্জিন (Catbox Engine - 100% Never Expires)
    function uploadPermanentVideo() {
        const fileInput = document.getElementById('videoInput');
        const file = fileInput.files[0];
        
        if (!file) {
            alert('অনুগ্রহ করে একটি ভিডিও ফাইল সিলেক্ট করুন!');
            return;
        }

        const totalMB = (file.size / (1024 * 1024)).toFixed(2);
        if (totalMB > 200) {
            alert('ভিডিও ফাইল ২০০ MB এর চেয়ে বড় হতে পারবে না!');
            return;
        }

        const statusDiv = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        progressBar.style.display = 'block';
        progressFill.style.width = '0%';
        statusDiv.innerText = `⚡ স্থায়ী ক্লাউড স্টোরেজে আপলোড হচ্ছে...`;

        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('userhash', userHash);
        formData.append('fileToUpload', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://corsproxy.io/?https://catbox.moe/user/api.php', true);

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const loadedMB = (e.loaded / (1024 * 1024)).toFixed(2);
                const percent = Math.round((e.loaded / e.total) * 100);
                progressFill.style.width = percent + '%';
                statusDiv.innerText = `⏳ আপলোড হচ্ছে: ${loadedMB} MB / ${totalMB} MB (${percent}%)`;
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                const directUrl = xhr.responseText.trim();
                const fileName = directUrl.split('/').pop();
                
                statusDiv.innerText = '✅ ভিডিও সফলভাবে আপলোড হয়েছে! (কখনোই ডিলিট হবে না)';

                const bloggerIframeCode = `<div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; max-width:100%; border-radius:8px;"><iframe src="${directUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" frameborder="0" allowfullscreen></iframe></div>`;
                const videoTagCode = `<video width="100%" controls preload="auto" playsinline webkit-playsinline>\n  <source src="${directUrl}" type="video/mp4">\n</video>`;

                const newVideo = {
                    id: Date.now(),
                    type: 'file',
                    name: file.name,
                    url: directUrl,
                    fileName: fileName,
                    downloadUrl: directUrl,
                    bloggerIframeCode: bloggerIframeCode,
                    videoTagCode: videoTagCode,
                    size: totalMB
                };

                saveVideoToStorage(newVideo);
                loadVideos();

                fileInput.value = '';
                document.getElementById('fileLabel').innerText = '📁 মোবাইল থেকে ভিডিও বেছে নিন (Up to 200 MB)';
                document.getElementById('fileInfo').style.display = 'none';
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    statusDiv.innerText = '';
                }, 3000);
            } else {
                statusDiv.innerText = '❌ আপলোড ব্যর্থ হয়েছে!';
            }
        };

        xhr.onerror = function() {
            statusDiv.innerText = '❌ নেটওয়ার্ক ত্রুটি!';
        };

        xhr.send(formData);
    }

    // ২. স্মার্ট ইউনিভার্সাল অফ-সাইট লিঙ্ক এমবেড জেনারেটর
    function generateUniversalEmbed() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (!urlInput) {
            alert('অনুগ্রহ করে একটি লিংক দিন!');
            return;
        }

        let url = urlInput;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }

        let iframeUrl = url;
        let isDirectMedia = url.match(/\.(mp4|webm|mkv|mov|avi)($|\?)/i);

        if (url.includes('streamtape.com/')) {
            iframeUrl = url.replace('/v/', '/e/');
            isDirectMedia = false;
        } else if (url.includes('luluvid.com/')) {
            const luluId = url.split('/').pop();
            iframeUrl = `https://luluvid.com/e/${luluId}`;
            isDirectMedia = false;
        } else if (url.includes('upfiles.com/')) {
            const upId = url.split('/').pop();
            iframeUrl = `https://upfiles.com/e/${upId}`;
            isDirectMedia = false;
        } else if (url.includes('pixeldrain.com/u/')) {
            const pixelId = url.split('/u/')[1].split('/')[0];
            iframeUrl = `https://pixeldrain.com/api/file/${pixelId}`;
            isDirectMedia = true;
        } else if (url.includes('streamable.com/')) {
            const streamableId = url.split('/').pop();
            iframeUrl = `https://streamable.com/e/${streamableId}`;
            isDirectMedia = false;
        } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (ytMatch) iframeUrl = `https://www.youtube.com/embed/${ytMatch[1]}`;
            isDirectMedia = false;
        } else if (url.includes('t.me/')) {
            const tgMatch = url.match(/t\.me\/([^\?\#]+)/);
            if (tgMatch) iframeUrl = `https://t.me/${tgMatch[1]}?embed=1`;
            isDirectMedia = false;
        }

        const bloggerIframeCode = `<div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; max-width:100%; border-radius:8px;"><iframe src="${iframeUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" frameborder="0" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen></iframe></div>`;
        
        let videoTagCode = bloggerIframeCode;
        let playerHTML = `<iframe src="${iframeUrl}" width="100%" height="350" frameborder="0" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen></iframe>`;

        if (isDirectMedia) {
            videoTagCode = `<video width="100%" controls preload="auto" playsinline webkit-playsinline>\n  <source src="${iframeUrl}" type="video/mp4">\n</video>`;
            playerHTML = `<video controls preload="auto" playsinline webkit-playsinline><source src="${iframeUrl}" type="video/mp4"></video>`;
        }

        const newVideo = {
            id: Date.now(),
            type: 'url',
            name: `Link Video (${url.length > 35 ? url.substring(0, 35) + '...' : url})`,
            url: url,
            downloadUrl: iframeUrl,
            bloggerIframeCode: bloggerIframeCode,
            videoTagCode: videoTagCode,
            playerHTML: playerHTML
        };

        saveVideoToStorage(newVideo);
        loadVideos();

        document.getElementById('urlInput').value = '';
        statusDiv.innerText = '✅ লিঙ্ক ও এমবেড কোড প্রস্তুত হয়েছে!';
        setTimeout(() => statusDiv.innerText = '', 3000);
    }

    function saveVideoToStorage(video) {
        let videos = JSON.parse(localStorage.getItem('my_catbox_videos') || '[]');
        videos.unshift(video);
        localStorage.setItem('my_catbox_videos', JSON.stringify(videos));
    }

    function loadVideos() {
        let videos = JSON.parse(localStorage.getItem('my_catbox_videos') || '[]');
        const videoListDiv = document.getElementById('videoList');
        const countText = document.getElementById('videoCountText');

        countText.innerText = `All videos (${videos.length})`;
        videoListDiv.innerHTML = '';

        if (videos.length === 0) {
            videoListDiv.innerHTML = '<p style="text-align:center; color:#777;">এখনো কোনো ভিডিও যোগ করা হয়নি।</p>';
            return;
        }

        videos.forEach((vid, index) => {
            let displayPlayer = vid.playerHTML || `<iframe src="${vid.url}" width="100%" height="350" frameborder="0" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen></iframe>`;
            let directLink = vid.url;
            let autoDownloadLink = vid.downloadUrl || vid.url;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div>${displayPlayer}</div>
                <div class="card-body">
                    <h4 class="video-title">${vid.name} ${vid.size ? `<span style="font-size:12px; color:#666; font-weight:normal;">(${vid.size} MB)</span>` : ''}</h4>
                    
                    <!-- ডাইরেক্ট লিঙ্ক ও ওপেন অপশন -->
                    <div class="link-row">
                        <span class="link-text">${directLink}</span>
                        <button class="btn-copy-main" onclick="copyToClipboard('${directLink}')">🔗 Copy Link</button>
                        <a href="${directLink}" target="_blank" class="btn-open">↗️ Open</a>
                    </div>

                    <div class="actions-row">
                        <button class="action-btn" onclick="toggleEmbed(${index})">&lt;/&gt; Embed Codes & Auto Download Link</button>
                        <button class="action-btn delete" onclick="deleteVideoServer('${vid.id}', '${vid.fileName}', '${vid.type}')">🗑️ Delete</button>
                    </div>

                    <div class="embed-box" id="embedBox_${index}">
                        <label style="font-size:11px; font-weight:bold; color:#0066ff;">⚡ ১. Auto Direct Download Link (অটো ডাউনলোডের লিঙ্ক):</label>
                        <textarea readonly>${autoDownloadLink}</textarea>
                        <button class="btn-copy" style="background:#0066ff; color:white; margin-bottom:12px;" onclick="copyToClipboard('${autoDownloadLink}')">⚡ অটো ডাইরেক্ট লিঙ্ক কপি করুন</button>

                        <label style="font-size:11px; font-weight:bold; color:#28a745; display:block;">📝 ২. Blogger Responsive iFrame Code (ব্লগারে বসানোর জন্য):</label>
                        <textarea readonly>${vid.bloggerIframeCode}</textarea>
                        <button class="btn-copy" style="background:#28a745; color:white; margin-bottom:12px;" onclick="copyToClipboard('${vid.bloggerIframeCode}')">📝 ব্লগার কোড কপি করুন</button>

                        <label style="font-size:11px; font-weight:bold; display:block;">🎬 ৩. HTML Player Code:</label>
                        <textarea readonly>${vid.videoTagCode}</textarea>
                    </div>
                </div>
            `;
            videoListDiv.appendChild(card);
        });
    }

    function toggleEmbed(index) {
        const box = document.getElementById(`embedBox_${index}`);
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    // সার্ভার ও ড্যাশবোর্ড থেকে স্থায়ী ডিলিট করার ফাংশন
    async function deleteVideoServer(id, fileName, type) {
        if (!confirm('আপনি কি সত্যিই এই ভিডিওটি সার্ভার এবং তালিকা থেকে সম্পূর্ণ মুছে ফেলতে চান?')) {
            return;
        }

        if (type === 'file' && fileName) {
            const formData = new FormData();
            formData.append('reqtype', 'deletefiles');
            formData.append('userhash', userHash);
            formData.append('files', fileName);

            try {
                await fetch('https://corsproxy.io/?https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {
                console.error("Server deletion error", e);
            }
        }

        let videos = JSON.parse(localStorage.getItem('my_catbox_videos') || '[]');
        videos = videos.filter(v => v.id.toString() !== id.toString());
        localStorage.setItem('my_catbox_videos', JSON.stringify(videos));
        loadVideos();
        alert('ভিডিওটি সফলভাবে ডিলিট করা হয়েছে!');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert('কপি করা হয়েছে!');
    }
</script>

</body>
</html>
